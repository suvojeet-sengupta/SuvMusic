name: Android KMP Verification

on:
  push:
    branches:
      - main
      - dev
      - feat/kmp-linux-desktop-migration
    paths:
      - 'app/**'
      - 'composeApp/**'
      - 'core/**'
      - 'extractor/**'
      - 'media-source/**'
      - 'scrobbler/**'
      - 'lyric-*/**'
      - 'updater/**'
      - 'gradle/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-kmp-verification.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'composeApp/**'
      - 'core/**'
      - 'extractor/**'
      - 'media-source/**'
      - 'scrobbler/**'
      - 'lyric-*/**'
      - 'updater/**'
      - 'gradle/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-kmp-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Verify Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          # API 37 is currently published as the preview package android-37.0.
          sdkmanager --channel=1 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Install Protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble Android debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
          LAST_FM_SHARED_SECRET: ${{ secrets.LAST_FM_SHARED_SECRET }}
          GRADLE_OPTS: -Dorg.gradle.workers.max=2

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SuvMusic-Android-debug-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: app/build/outputs/apk/debug/*.apk
