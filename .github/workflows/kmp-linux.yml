name: KMP Linux Desktop

on:
  push:
    branches:
      - main
      - dev
      - feat/kmp-linux-desktop-migration
    paths:
      - 'composeApp/**'
      - 'core/**'
      - 'media-source/**'
      - 'lyric-*/**'
      - 'extractor/**'
      - 'scrobbler/**'
      - 'updater/**'
      - 'gradle/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/kmp-linux.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'composeApp/**'
      - 'core/**'
      - 'media-source/**'
      - 'lyric-*/**'
      - 'extractor/**'
      - 'scrobbler/**'
      - 'updater/**'
      - 'gradle/**'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/kmp-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-desktop:
    name: Build Linux desktop packages
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fakeroot rpm cpio libfuse2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile shared and desktop code
        run: ./gradlew :composeApp:compileKotlinDesktop --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.workers.max=2

      - name: Build Debian and RPM packages
        run: >-
          ./gradlew
          :composeApp:packageReleaseDeb
          :composeApp:packageReleaseRpm
          --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.workers.max=2

      - name: Validate generated artifacts
        run: |
          set -euo pipefail
          test -n "$(find composeApp/build/compose/binaries -type f -name '*.deb' -print -quit)"
          test -n "$(find composeApp/build/compose/binaries -type f -name '*.rpm' -print -quit)"
          find composeApp/build/compose/binaries -type f \( -name '*.deb' -o -name '*.rpm' \) -print

      - name: Verify bundled runtime modules
        run: |
          set -euo pipefail
          rpm_file="$(find composeApp/build/compose/binaries -type f -name '*.rpm' -print -quit)"
          extract_dir="$RUNNER_TEMP/suvmusic-rpm-root"
          mkdir -p "$extract_dir"
          rpm2cpio "$rpm_file" | (cd "$extract_dir" && cpio -idm --quiet)
          modules_file="$(find "$extract_dir" -path '*/lib/runtime/lib/modules' -print -quit)"
          test -n "$modules_file"
          "$JAVA_HOME/bin/jimage" list "$modules_file" | awk '
            /Module: java.sql/ { in_sql = 1 }
            in_sql && /java\\/sql\\/DriverManager.class/ { found = 1 }
            END { exit found ? 0 : 1 }
          '

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: SuvMusic-Linux-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            composeApp/build/compose/binaries/**/*.deb
            composeApp/build/compose/binaries/**/*.rpm

